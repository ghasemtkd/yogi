<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#090714" />
    <link rel="preload" href="yogiyar-ui.woff2" as="font" type="font/woff2" crossorigin />
    <title>یوگی | داستان</title>
    <style>
      @font-face {
        font-family: "YogitoUI";
        src: url("yogiyar-ui.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --ink: #f0f3f7;
        --muted: #a5afbd;
        --violet: #8268c9;
        --violet-deep: #34285f;
        --mint: #4fd0bd;
        --night: #050608;
        --line: rgba(220, 228, 238, 0.11);
        --glass: rgba(13, 15, 21, 0.78);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: "YogitoUI", Vazirmatn, "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 50% 112%, rgba(46, 58, 96, 0.34), transparent 42rem),
          radial-gradient(circle at 7% 2%, rgba(36, 163, 147, 0.08), transparent 27rem),
          radial-gradient(circle at 97% 17%, rgba(93, 70, 153, 0.14), transparent 30rem),
          var(--night);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .34;
        background-image:
          linear-gradient(rgba(255, 255, 255, .026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, .026) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: radial-gradient(circle at center, black, transparent 78%);
      }

      .orbit {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .orb {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, .18);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, .22), 0 18px 44px rgba(0, 0, 0, .22);
        backdrop-filter: blur(12px);
        will-change: transform;
      }

      .orb {
        --rise: -22px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(221, 231, 240, .12), rgba(221, 231, 240, .015));
        animation: bubble-drift var(--float-duration, 11s) cubic-bezier(.45, .05, .55, .95) infinite alternate both;
      }

      .orb.one {
        width: 13rem;
        height: 13rem;
        top: -4rem;
        right: -4rem;
        --rise: -28px;
        --float-duration: 13s;
        animation-delay: -8s;
      }

      .orb.two {
        width: 6.5rem;
        height: 6.5rem;
        top: 14%;
        left: 8%;
        --rise: 19px;
        --float-duration: 10s;
        animation-delay: -5s;
      }

      .orb.three {
        width: 4.1rem;
        height: 4.1rem;
        right: 14%;
        bottom: 13%;
        --rise: -17px;
        --float-duration: 9s;
        animation-delay: -3s;
      }

      .orb.four {
        width: 9.5rem;
        height: 9.5rem;
        bottom: -3.5rem;
        left: -3.5rem;
        --rise: 23px;
        --float-duration: 14s;
        animation-delay: -10s;
      }

      .site {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: clamp(.7rem, 2.5vw, 1.4rem);
      }

      .story-shell {
        position: relative;
        display: grid;
        width: min(100%, 940px);
        height: min(100dvh, 800px);
        min-height: 0;
        place-items: center;
        padding: clamp(3.2rem, 6.4vh, 4.7rem) 0 clamp(4.2rem, 7.4vh, 5.2rem);
      }

      .halo {
        position: absolute;
        z-index: -1;
        width: 76%;
        height: 67%;
        top: 17%;
        left: 12%;
        border-radius: 50%;
        filter: blur(58px);
        background: linear-gradient(105deg, rgba(79, 62, 145, .34), rgba(27, 117, 107, .12));
      }

      .story-card {
        position: relative;
        display: block;
        width: min(89vw, 820px);
        height: min(75dvh, 660px);
        min-height: 0;
        overflow: hidden;
        isolation: isolate;
        border: 1px solid var(--line);
        border-radius: clamp(2rem, 5vw, 3.2rem);
        background:
          linear-gradient(130deg, rgba(255, 255, 255, .055), transparent 31%),
          var(--glass);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, .23),
          inset 0 -28px 72px rgba(0, 0, 0, .17),
          0 38px 100px rgba(0, 0, 0, .48);
        backdrop-filter: blur(23px) saturate(138%);
      }

      .scene-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(0, 1.55fr) minmax(9.25rem, .75fr);
        will-change: transform;
        transition: transform .72s cubic-bezier(.22, .84, .28, 1);
      }

      .scene.enter-from-right { transform: translate3d(100%, 0, 0); }
      .scene.enter-from-left { transform: translate3d(-100%, 0, 0); }
      .scene.exit-to-left { transform: translate3d(-100%, 0, 0); }
      .scene.exit-to-right { transform: translate3d(100%, 0, 0); }

      .scene.is-intro {
        grid-template-rows: minmax(0, 1fr);
      }

      .scene.is-intro .media-pane {
        display: none;
      }

      .scene.is-intro .copy-pane {
        grid-template-rows: minmax(0, 1fr);
        padding: clamp(1.2rem, 6vw, 3.2rem);
      }

      .scene.is-intro .story-feed {
        justify-content: center;
        gap: 0;
        padding: 0;
      }

      .scene.is-intro .dots {
        display: none;
      }

      .intro-action {
        display: flex;
        flex: 0 0 auto;
        width: 100%;
        justify-content: center;
        margin: 2.4em auto 0;
        padding: 0 0 .45rem;
      }

      .intro-start-button {
        position: static;
        min-width: clamp(8.3rem, 23vw, 11.2rem);
      }

      .intro-wipe {
        position: absolute;
        z-index: 8;
        top: 0;
        right: 0;
        left: 0;
        height: 2px;
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(134, 220, 255, .92) 18%, rgba(255, 255, 255, .98) 50%, rgba(185, 135, 255, .92) 82%, transparent);
        box-shadow: 0 0 10px rgba(130, 210, 255, .84), 0 0 28px rgba(167, 108, 255, .64);
      }

      .scene.is-intro-wiping {
        z-index: 2;
      }

      .scene.is-intro-wiping .intro-wipe {
        animation: intro-wipe-line 2.35s linear both;
      }

      .scene.is-intro-wiping .copy-pane {
        animation: intro-copy-clear 2.35s linear both;
      }

      .scene.intro-reveal-scene {
        z-index: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate3d(-1.2rem, 0, 0);
        transition: opacity .56s ease, transform .56s cubic-bezier(.22, .8, .24, 1);
      }

      .scene.intro-reveal-scene.is-revealing {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .dread-veil {
        position: absolute;
        z-index: 5;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        background: transparent;
        transition: opacity .14s ease;
      }

      .dread-veil::before {
        content: "";
        position: absolute;
        inset: -42%;
        border-radius: 50%;
        opacity: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 24deg,
          rgba(104, 57, 194, .66) 52deg,
          transparent 92deg 145deg,
          rgba(181, 45, 112, .5) 195deg,
          transparent 241deg 297deg,
          rgba(66, 130, 219, .44) 333deg,
          transparent 360deg
        );
        mix-blend-mode: screen;
        -webkit-mask-image: radial-gradient(circle at center, transparent 0 36%, #000 38% 53%, transparent 55%);
        mask-image: radial-gradient(circle at center, transparent 0 36%, #000 38% 53%, transparent 55%);
      }

      .dread-veil::after {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px solid rgba(182, 97, 236, .5);
        border-radius: 48%;
        opacity: 0;
        box-shadow:
          14px -11px 20px rgba(100, 75, 236, .7),
          -17px 12px 23px rgba(218, 73, 151, .62),
          3px 17px 21px rgba(66, 169, 255, .62);
        transform-origin: center;
      }

      .scene.is-dread-active .dread-veil {
        opacity: 1;
      }

      .scene.is-dread-active .dread-veil::before {
        opacity: .88;
        animation: dread-vortex .32s linear infinite;
      }

      .scene.is-dread-active .dread-veil::after {
        opacity: .92;
        animation: dread-trails .42s linear infinite;
      }

      .story-entry.kherkol.is-impact-message {
        position: relative;
        z-index: 6;
      }

      .story-entry.kherkol.is-impact-message .message-bubble {
        border-color: rgba(236, 197, 255, .76);
        box-shadow: 0 0 24px rgba(177, 62, 211, .64), 0 0 50px rgba(71, 63, 209, .38);
      }

      .story-card::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 21rem;
        height: 21rem;
        top: -14rem;
        left: -10rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(116, 93, 176, .19), transparent 68%);
      }

      .media-pane {
        min-height: 0;
        padding: 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(255, 255, 255, .1);
      }

      .image-shell {
        position: relative;
        display: grid;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        place-items: center;
        border: 0;
        border-radius: 0;
        background: #06080d;
      }

      .image-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 255, 255, .1), transparent 24%, transparent 75%, rgba(255, 255, 255, .04));
      }

      .story-image {
        display: none;
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none;
        max-height: none;
        object-fit: fill !important;
        object-position: center;
      }

      .scene.has-image .story-image { display: block; }
      .scene.has-image .intro-art { display: none; }
      .scene.has-image .image-shell::after { display: none; }

      .intro-art {
        display: grid;
        place-items: center;
        gap: .85rem;
        text-align: center;
      }

      .intro-art p {
        margin: 0;
        color: rgba(239, 233, 255, .63);
        font-size: clamp(.68rem, 1.8vw, .88rem);
        letter-spacing: .13em;
      }

      .copy-pane {
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: .45rem;
        padding: clamp(.75rem, 2vw, 1.2rem) clamp(.9rem, 3.6vw, 2.3rem);
        text-align: center;
      }

      .story-feed {
        display: flex;
        min-height: 0;
        flex-direction: column;
        gap: .58rem;
        overflow: hidden;
        padding: .15rem .08rem .35rem;
        scroll-behavior: smooth;
        overscroll-behavior: none;
        pointer-events: none;
      }

      .story-feed.is-complete {
        overflow-x: hidden;
        overflow-y: auto;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(164, 191, 235, .58) transparent;
      }

      .story-feed.is-complete::-webkit-scrollbar { width: .38rem; }
      .story-feed.is-complete::-webkit-scrollbar-track { background: transparent; }
      .story-feed.is-complete::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(164, 191, 235, .5);
      }

      .story-entry {
        display: flex;
        align-items: center;
        width: 100%;
        direction: ltr;
        animation: message-arrive .42s cubic-bezier(.2, .8, .2, 1) both;
      }

      .story-entry.is-instant { animation: none; }

      .message-avatar {
        flex: 0 0 auto;
        width: clamp(1.85rem, 4.5vw, 2.55rem);
        aspect-ratio: 1;
        display: block;
        object-fit: contain;
        object-position: center;
      }

      .message-bubble {
        max-width: min(85%, 31rem);
        padding: .58rem .82rem;
        border: 1px solid rgba(226, 235, 246, .13);
        border-radius: 1.15rem;
        direction: rtl;
        color: var(--ink);
        font-size: clamp(.7rem, 1.7vw, .9rem);
        line-height: 1.7;
        text-align: right;
        overflow-wrap: anywhere;
        backdrop-filter: blur(18px) saturate(135%);
      }

      .story-entry.yogi .message-bubble {
        border-color: rgba(108, 181, 255, .38);
        border-top-right-radius: .38rem;
        color: #eaf5ff;
        background: linear-gradient(135deg, rgba(42, 114, 196, .72), rgba(20, 57, 112, .68));
        box-shadow: inset 0 1px rgba(214, 239, 255, .23), 0 9px 24px rgba(19, 93, 180, .2);
      }

      .story-entry.nila .message-bubble {
        border-color: rgba(255, 144, 194, .39);
        border-top-left-radius: .38rem;
        color: #fff0f7;
        background: linear-gradient(135deg, rgba(190, 67, 128, .74), rgba(108, 35, 79, .68));
        box-shadow: inset 0 1px rgba(255, 228, 241, .23), 0 9px 24px rgba(173, 42, 108, .19);
      }

      .story-entry.kherkol .message-bubble {
        border-color: rgba(188, 152, 255, .4);
        border-top-left-radius: .38rem;
        color: #f5efff;
        background: linear-gradient(135deg, rgba(116, 71, 179, .76), rgba(59, 37, 103, .69));
        box-shadow: inset 0 1px rgba(237, 223, 255, .22), 0 9px 24px rgba(87, 43, 151, .19);
      }

      .story-entry.yogi { justify-content: flex-end; }
      .story-entry.nila,
      .story-entry.kherkol { justify-content: flex-start; }

      .story-entry.yogi .message-avatar {
        order: 2;
        margin-left: .48rem;
      }

      .story-entry.nila .message-avatar {
        margin-right: .48rem;
      }

      .story-entry.kherkol .message-avatar {
        margin-right: .48rem;
      }

      .story-entry.narration,
      .story-entry.chapter {
        justify-content: center;
      }

      .story-entry.narration .message-bubble {
        max-width: 92%;
        padding: .08rem .5rem;
        border: 0;
        color: var(--muted);
        background: transparent;
        box-shadow: none;
        font-size: clamp(.67rem, 1.55vw, .82rem);
        line-height: 1.72;
        text-align: center;
      }

      .story-entry.chapter .message-bubble {
        max-width: 96%;
        padding: .18rem .55rem .4rem;
        border: 0;
        color: var(--ink);
        background: transparent;
        box-shadow: none;
        font-size: clamp(1.05rem, 3.5vw, 1.75rem);
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -.035em;
        text-align: center;
      }

      .story-entry.cave-question,
      .story-entry.cave-options {
        justify-content: center;
      }

      .story-entry.cave-question .message-bubble {
        width: min(92%, 32rem);
        max-width: 92%;
        padding: clamp(.72rem, 2.8vw, 1.05rem) clamp(1rem, 4vw, 1.8rem);
        border-color: rgba(236, 215, 163, .36);
        border-radius: 1.3rem;
        color: #fff6db;
        background: linear-gradient(135deg, rgba(20, 13, 14, .72), rgba(58, 38, 19, .46));
        box-shadow: inset 0 1px rgba(255, 239, 196, .18), 0 12px 35px rgba(0, 0, 0, .28);
        font-size: clamp(.9rem, 2.7vw, 1.22rem);
        font-weight: 900;
        line-height: 1.8;
        text-align: center;
      }

      .story-entry.cave-options {
        margin-top: clamp(.85rem, 3vh, 1.5rem);
      }

      .cave-choice-grid {
        display: grid;
        width: min(94%, 35rem);
        grid-template-columns: repeat(4, minmax(0, 1fr));
        direction: ltr;
        gap: clamp(.36rem, 1.25vw, .78rem);
      }

      .cave-choice-button {
        --choice-rgb: 255, 137, 31;
        display: grid;
        min-width: 0;
        min-height: clamp(2.75rem, 7.5vw, 3.65rem);
        place-items: center;
        border: 1px solid rgba(var(--choice-rgb), .64);
        border-radius: clamp(.9rem, 2.4vw, 1.3rem);
        color: #fffdf7;
        text-decoration: none;
        font-size: clamp(1rem, 3vw, 1.42rem);
        font-weight: 950;
        line-height: 1;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, .18), transparent 35%),
          linear-gradient(145deg, rgba(var(--choice-rgb), .62), rgba(9, 10, 13, .68));
        box-shadow:
          inset 0 1px rgba(255, 255, 255, .26),
          inset 0 -1px rgba(0, 0, 0, .22),
          0 10px 28px rgba(var(--choice-rgb), .21);
        backdrop-filter: blur(16px) saturate(145%);
        transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, filter .22s ease;
      }

      .cave-choice-button:nth-child(2) { --choice-rgb: 54, 169, 218; }
      .cave-choice-button:nth-child(3) { --choice-rgb: 180, 92, 255; }
      .cave-choice-button:nth-child(4) { --choice-rgb: 230, 109, 37; }

      .cave-choice-button:hover,
      .cave-choice-button:focus-visible {
        transform: translateY(-3px) scale(1.025);
        border-color: rgba(var(--choice-rgb), .98);
        box-shadow:
          inset 0 1px rgba(255, 255, 255, .34),
          0 15px 35px rgba(var(--choice-rgb), .38);
        filter: brightness(1.08);
        outline: 0;
      }

      .cave-choice-button:active { transform: translateY(-1px) scale(.98); }

      .story-entry.intro-title,
      .story-entry.intro-copy,
      .story-entry.intro-bridge,
      .story-entry.intro-emphasis,
      .story-entry.intro-ready,
      .story-entry.intro-prologue {
        justify-content: center;
      }

      .story-entry.intro-title .message-bubble,
      .story-entry.intro-copy .message-bubble,
      .story-entry.intro-bridge .message-bubble,
      .story-entry.intro-emphasis .message-bubble,
      .story-entry.intro-ready .message-bubble,
      .story-entry.intro-prologue .message-bubble {
        max-width: 96%;
        padding: 0;
        border: 0;
        color: var(--ink);
        background: transparent;
        box-shadow: none;
        text-align: center;
      }

      .story-entry.intro-title .message-bubble {
        font-size: clamp(1.22rem, 4.2vw, 2.15rem);
        font-weight: 900;
        line-height: 1.5;
      }

      .story-entry.intro-copy .message-bubble {
        color: rgba(232, 239, 248, .82);
        font-size: clamp(.78rem, 2.1vw, 1rem);
        line-height: 1.65;
      }

      .story-entry.intro-bridge .message-bubble {
        margin: .45rem 0;
        color: rgba(188, 203, 224, .75);
        font-size: clamp(.82rem, 2.3vw, 1.05rem);
      }

      .story-entry.intro-emphasis .message-bubble {
        color: #eef7ff;
        font-size: clamp(.9rem, 2.6vw, 1.22rem);
        font-weight: 850;
        line-height: 1.55;
      }

      .story-entry.intro-ready .message-bubble {
        margin-top: .55rem;
        color: #9ee4ff;
        font-size: clamp(1.08rem, 3.1vw, 1.4rem);
        font-weight: 900;
      }

      .story-entry.intro-prologue .message-bubble {
        max-width: min(92%, 43rem);
        color: rgba(237, 244, 253, .9);
        font-size: clamp(.76rem, 2vw, 1rem);
        line-height: 2.05;
        text-align: center;
      }

      .story-entry.boom { justify-content: center; }

      .story-entry.boom .message-bubble {
        max-width: 96%;
        padding: .22rem .7rem;
        border: 0;
        color: #fff4f0;
        background: transparent;
        box-shadow: 0 0 24px rgba(242, 93, 61, .62);
        font-size: clamp(1.35rem, 5vw, 2.35rem);
        font-weight: 950;
        letter-spacing: .14em;
        line-height: 1.2;
        text-align: center;
        text-shadow: 0 0 12px rgba(255, 111, 71, .78), 0 0 28px rgba(255, 37, 80, .45);
      }

      .dots {
        display: flex;
        justify-content: center;
        direction: ltr;
        gap: .32rem;
        margin-top: .15rem;
      }

      .dot {
        width: .4rem;
        height: .4rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, .19);
        transition: width .32s ease, background .32s ease, box-shadow .32s ease;
      }

      .dot.is-active {
        width: 1.35rem;
        background: var(--mint);
        box-shadow: 0 0 14px rgba(118, 241, 215, .65);
      }

      .controls {
        position: absolute;
        right: 0;
        bottom: clamp(.2rem, 2.4vh, 1rem);
        left: 0;
        height: 3.5rem;
      }

      .story-button {
        position: absolute;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: clamp(7.6rem, 20vw, 10.2rem);
        height: 3.25rem;
        padding: 0 1.15rem;
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 1.15rem;
        color: #fff;
        font: inherit;
        font-size: clamp(.78rem, 1.8vw, .94rem);
        font-weight: 850;
        cursor: pointer;
        transition: transform .25s ease, background .25s ease, border-color .25s ease, opacity .25s ease;
        backdrop-filter: blur(18px) saturate(135%);
      }

      .story-button:hover { transform: translateY(-3px); }
      .story-button:active { transform: translateY(-1px) scale(.98); }

      .next-button {
        right: 0;
        background: linear-gradient(135deg, rgba(112, 88, 178, .94), rgba(45, 36, 82, .94));

        color: #d9dce5;

        right: 50%;
        background: rgba(21, 31, 51, .82);

      .controls.is-intro .replay-button { display: none; }

        cursor: default;
        opacity: .64;
        filter: saturate(.65);
      }

      .story-button[disabled]:hover { transform: none; }
      .story-button[hidden] { display: none; }

      .loading-screen {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        overflow: hidden;
        place-items: center;
        background: #050608;
        transition: opacity .72s ease, visibility .72s ease;
      }

      .loading-screen.is-complete {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .loading-image {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        object-fit: fill !important;
        object-position: center;
        background: #050608;
        opacity: .9;
        animation: loading-zoom 5s ease-out both;
      }

      .loading-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(5, 6, 9, .12), rgba(5, 6, 9, .52)),
          radial-gradient(circle at 50% 50%, transparent 16%, rgba(5, 6, 9, .22) 100%);

      .loading-status {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: .72rem;
      }

      .loader {
        height: 15px;
        aspect-ratio: 4;
        --_g: no-repeat radial-gradient(farthest-side, #fff 90%, transparent);
        display: grid;
        background: var(--_g) left, var(--_g) right;
        background-size: 25% 100%;
        filter: drop-shadow(0 0 9px rgba(255, 255, 255, .92)) drop-shadow(0 0 24px rgba(226, 242, 255, .74));
      }

      .loader::before,
      .loader::after {
        content: "";
        grid-area: 1 / 1;
        height: inherit;
        aspect-ratio: 1;
        margin: auto;
        border-radius: 50%;
        transform-origin: -100% 50%;
        background: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, .95), 0 0 26px rgba(221, 241, 255, .75);
        animation: l49 1s infinite linear;
      }

      .loader::after {
        transform-origin: 200% 50%;
        --s: -1;
        animation-delay: -.5s;
      }

      .loading-percent {
        display: inline-flex;
        direction: ltr;
        align-items: baseline;
        justify-content: center;
        min-width: 4rem;
        color: rgba(255, 255, 255, .96);
        font-family: "YogitoUI", Vazirmatn, "Segoe UI", Tahoma, sans-serif;
        font-size: clamp(.8rem, 2.4vw, 1rem);
        font-weight: 900;
        letter-spacing: .035em;
        text-shadow: 0 0 12px rgba(255, 255, 255, .92), 0 0 28px rgba(216, 237, 255, .62);
        transition: opacity .2s ease;
      }

      @keyframes bubble-drift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(0, var(--rise), 0); }
      }

      @keyframes intro-wipe-line {
        0% { top: 0; opacity: 0; }
        3% { opacity: 1; }
        95% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      @keyframes intro-copy-clear {
        from { clip-path: inset(0 0 0 0); }
        to { clip-path: inset(100% 0 0 0); }
      }

      @keyframes page-quake {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0); }
        12% { transform: translate3d(-8px, 2px, 0) rotate(-.35deg); }
        27% { transform: translate3d(9px, -4px, 0) rotate(.28deg); }
        43% { transform: translate3d(-7px, 4px, 0) rotate(-.22deg); }
        58% { transform: translate3d(6px, -3px, 0) rotate(.2deg); }
        74% { transform: translate3d(-4px, 2px, 0) rotate(-.12deg); }
        88% { transform: translate3d(3px, -1px, 0) rotate(.07deg); }
      }

      @keyframes dread-vortex {
        from { transform: rotate(0deg) scale(1); }
        to { transform: rotate(360deg) scale(1.08); }
      }

      @keyframes dread-trails {
        from { transform: rotate(0deg) scale(.94); }
        to { transform: rotate(-360deg) scale(1.05); }
      }

      @keyframes message-arrive {
        from { opacity: 0; transform: translateY(12px) scale(.975); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes l49 {
        58%,
        100% {
          transform: rotate(calc(var(--s, 1) * 1turn));
        }
      }

      @keyframes loading-zoom {
        from { transform: scale(1); }
        to { transform: scale(1); }
      }

      body.is-shaking .site,
      body.is-shaking .orbit {
        animation: page-quake .58s cubic-bezier(.36, .07, .19, .97) both;
      }

      @media (max-width: 580px) {
        .story-card { width: 92vw; }
        .controls { right: 0; left: 0; }
      }

      @media (max-height: 640px) {
        .story-shell { padding-top: 2.8rem; padding-bottom: 4.2rem; }
        .story-card {

        }
        .scene { grid-template-rows: minmax(0, 1.48fr) minmax(7.4rem, .72fr); }
        .media-pane { padding: 0; }
        .copy-pane { gap: .35rem; padding: .75rem 1rem; }
        .story-feed { gap: .38rem; }
        .message-bubble { padding: .46rem .67rem; line-height: 1.54; }
        .message-avatar { width: 1.9rem; }
        .dots { margin-top: 0; }
        .controls { height: 3rem; }
        .story-button { height: 2.8rem; min-width: 7.1rem; border-radius: 1rem; }
      }

      @media (max-height: 450px) {
        .story-shell { padding-top: 2rem; padding-bottom: 3.45rem; }

        .intro-art { gap: .35rem; }

        .story-entry.chapter .message-bubble { font-size: .88rem; }
        .story-button { height: 2.45rem; min-width: 6.25rem; font-size: .68rem; }
      }

              { kind: "yogi", text: "نیلاااا!" },
              { kind: "narration", text: "اما نیلا هر لحظه دورتر می شد." },
              { kind: "narration", text: "خرکول بدون اینکه توقف کند، نیلا را با خودش می برد و یوگی تنها در میان خیابان باقی مانده بود." }
            ]
          },
          {
            image: "8.webp",
            nextLabel: "ادامه",
            autoplay: true,
            entries: [
              { kind: "chapter", text: "چاه اسرارآمیز" },
              { kind: "narration", text: "خرکول نیلا را در دستش گرفت و وارد کوچه ای خلوت شد." },
              { kind: "narration", text: "در انتهای کوچه، یک چاه عجیب وجود داشت. از داخل چاه نور سبز و عجیبی بیرون می آمد." },
              { kind: "narration", text: "خرکول بدون توقف به سمت چاه رفت و وارد آن شد." },
              { kind: "narration", text: "در همان لحظه، یوگی هم به کوچه رسید." },
              { kind: "narration", text: "او به سمت چاه نزدیک شد و با نگرانی به داخلش نگاه کرد." },
              { kind: "narration", text: "یوگی می دانست که نیلا همراه خرکول به داخل چاه رفته است." },
              { kind: "narration", text: "حالا او تنها چند قدم با آن چاه سبزرنگ فاصله داشت..." }
            ]
          },
          {
            image: "9.webp",
            nextLabel: "ادامه",
            autoplay: true,
            entries: [
              { kind: "chapter", text: "شروع" },
              { kind: "narration", text: "خرکول وارد چاه شد و در میان نور سبز و عجیبی ناپدید شد." },
              { kind: "narration", text: "در واقع، آن چاه یک دروازهٔ جادویی برای تلپورت بود." },
              { kind: "narration", text: "یوگی از بالای چاه دید که خرکول، در حالی که نیلا را با خودش گرفته بود، وارد دروازه شده است." },
              { kind: "narration", text: "یوگی حتی یک لحظه هم مکث نکرد." },
              { kind: "narration", text: "او بدون تردید خودش را به داخل چاه انداخت و به دنبال خرکول و نیلا وارد دروازهٔ جادویی شد." },
              { kind: "narration", text: "هر سه در میان تونل تاریک و نورهای سبز به سمت دنیایی نامعلوم در حرکت بودند..." }
            ]
          },
          {
            image: "10.webp",
            nextLabel: "انتخاب غار",
            autoplay: true,
            entries: [
              { kind: "chapter", text: "غار چهار سر" },
              { kind: "narration", text: "یوگی از دروازهٔ جادویی به پایین پرتاب شد و با شدت روی توده ای از استخوان ها و اسکلت های قدیمی افتاد." },
              { kind: "narration", text: "چند لحظه طول کشید تا توانست بلند شود." },
              { kind: "narration", text: "وقتی سرش را بالا آورد، با صحنه ای عجیب روبه رو شد." },
              { kind: "narration", text: "در مقابلش چهار ورودی غار قرار داشت؛ چهار دروازه که دیوارهایشان پر از نقش ها و نگاره های اسرارآمیز بود." },
              { kind: "narration", text: "روی دیوار غار اول، تصویر آرش کمانگیر دیده می شد؛ کمانی بزرگ در دست داشت و تیرش به سوی آسمان نشانه رفته بود." },
              { kind: "narration", text: "روی غار دوم، تصویر فردوسی و داستان های کهن دیده می شد." },
              { kind: "narration", text: "روی دیوار غار سوم، نگاره هایی از مریم میرزاخانی در میان فرمول ها، شکل های هندسی و نقش های ریاضی دیده می شد." },
              { kind: "narration", text: "و روی غار چهارم، تصویر عجیبی از ویروس کووید ۲۰۱۹ دیده می شد؛ در کنار آن نیز گروه بزرگی از آدم ها با چهره هایی نگران و آشفته کنار هم جمع شده بودند." },
              { kind: "narration", text: "یوگی با تعجب به چهار غار نگاه کرد." },
              { kind: "narration", text: "او نمی دانست خرکول نیلا را از کدام مسیر برده است." },
              { kind: "narration", text: "اما مطمئن بود که برای پیدا کردن دوستش، باید وارد یکی از این چهار غار می شد..." }
            ]
          },
          {
            image: "10.webp",
            choicePage: true,
            nextLabel: "",
            final: true,
            autoplay: true,
            entries: [
              { kind: "cave-question", text: "وارد کدام غار می شوی؟", delayAfter: 800 },
              { kind: "cave-options", text: "", url: "https://rubika.ir/YogiPlusbot" }
            ]
          }
        ];

        const loadingScreen = document.getElementById("loading-screen");
        const loadingImage = document.querySelector(".loading-image");
        const sceneViewport = document.getElementById("scene-viewport");
        let activeScene = document.getElementById("active-scene");
        const sceneBlueprint = activeScene.cloneNode(true);
        sceneBlueprint.removeAttribute("id");
        const controls = document.querySelector(".controls");
        const nextButton = document.getElementById("next-button");
        const previousButton = document.getElementById("previous-button");
        const replayButton = document.getElementById("replay-button");
        const loadingPercentValue = document.getElementById("loading-percent-value");
        const messageAvatars = Object.freeze({
          yogi: "yogi.webp",
          nila: "nila.webp",
          kherkol: "kherkol.webp"
        });
        const slideDuration = 760;
        const introWipeDuration = 2350;
        const introRevealDuration = 560;
        const lastModifiedTime = Date.parse(document.lastModified);
        const assetVersion = Number.isFinite(lastModifiedTime)
          ? lastModifiedTime.toString(36)
          : "webp-v1";
        const freshAsset = (assetPath) => `${assetPath}?v=${assetVersion}`;
        const assetCacheName = `yogi-adventure-assets-${assetVersion}`;
        const assetCachePrefix = "yogi-adventure-assets-";
        const assetSources = new Map();
        const imageAssets = Object.freeze(Array.from(new Set([
          "loding.webp",
          ...pages.map((page) => page.image).filter(Boolean),
          ...Object.values(messageAvatars)
        ])));

        if (window.location.search) {
          window.history.replaceState(null, "", `${window.location.pathname}${window.location.hash}`);
        }
        let currentPage = 0;
        let playbackVersion = 0;
        let isSliding = false;
        const completedPages = new Set();

        const numberToPersian = (number) => number.toLocaleString("fa-IR", { useGrouping: false });

        const setLoadingProgress = (percent) => {
          loadingPercentValue.textContent = String(Math.max(0, Math.min(100, Math.round(percent))));
        };

        const getAssetSource = (assetPath) => assetSources.get(assetPath) || freshAsset(assetPath);

        const preloadWithImage = (url) => new Promise((resolve) => {
          const image = new Image();
          image.onload = image.onerror = () => resolve(url);
          image.src = url;
        });

        const openAssetCache = async () => {
          if (!("caches" in window)) return null;
          try {
            const cache = await window.caches.open(assetCacheName);
            const names = await window.caches.keys();
            await Promise.all(names
              .filter((name) => name.startsWith(assetCachePrefix) && name !== assetCacheName)
              .map((name) => window.caches.delete(name)));
            return cache;
          } catch {
            return null;
          }
        };

        const loadAsset = async (assetPath, cache) => {
          const url = freshAsset(assetPath);
          try {
            let response = cache ? await cache.match(url) : null;
            if (!response) {
              response = await fetch(url, { cache: "force-cache" });
              if (!response.ok) throw new Error(`Asset request failed: ${response.status}`);
              if (cache) await cache.put(url, response.clone());
            }
            const source = URL.createObjectURL(await response.blob());
            assetSources.set(assetPath, source);
            return source;
          } catch {
            const source = await preloadWithImage(url);
            assetSources.set(assetPath, source);
            return source;
          }
        };

        const preloadStoryAssets = async () => {
          const startedAt = performance.now();
          const cache = await openAssetCache();
          let completed = 0;
          setLoadingProgress(0);

          const preloadOne = async (assetPath) => {
            const source = await loadAsset(assetPath, cache);
            if (assetPath === "loding.webp") loadingImage.src = source;
            completed += 1;
            setLoadingProgress((completed / imageAssets.length) * 100);
          };

          const loadingAsset = preloadOne("loding.webp");
          const remainingAssets = imageAssets
            .filter((assetPath) => assetPath !== "loding.webp")
            .map(preloadOne);
          await Promise.all([loadingAsset, ...remainingAssets]);
          await wait(Math.max(0, 5000 - (performance.now() - startedAt)));
          setLoadingProgress(100);
        };

        const getSceneParts = (scene) => ({
          image: scene.querySelector(".story-image"),
          feed: scene.querySelector(".story-feed"),
          dots: scene.querySelector(".dots"),
          veil: scene.querySelector(".dread-veil")
        });

        const buildDots = (dots) => {
          dots.replaceChildren();
          pages.forEach(() => {
            const dot = document.createElement("span");
            dot.className = "dot";
            dot.setAttribute("aria-hidden", "true");
            dots.append(dot);
          });
        };

        const syncControls = (page, pageIndex, isLocked = false, allowContinueDuringTyping = false) => {
          const isIntro = Boolean(page.intro);
          const isChoicePage = Boolean(page.choicePage);
          controls.classList.toggle("is-intro", isIntro);
          controls.classList.toggle("is-choice-page", isChoicePage);
          nextButton.textContent = page.nextLabel;
          nextButton.hidden = isChoicePage;
          nextButton.disabled = isLocked || Boolean(page.final || (page.autoplay && !allowContinueDuringTyping));
          previousButton.hidden = isIntro || pageIndex < 2 || isChoicePage;
          previousButton.disabled = isLocked;
          replayButton.hidden = true;
          replayButton.disabled = isLocked;
        };

        const prepareScene = (scene, page, pageIndex) => {
          const { image, feed, dots } = getSceneParts(scene);

          feed.replaceChildren();
          feed.scrollTop = 0;
          feed.classList.remove("is-complete");
          scene.classList.remove("is-dread-active", "is-intro-wiping");
          scene.classList.toggle("is-intro", Boolean(page.intro));
          buildDots(dots);
          scene.classList.toggle("has-image", Boolean(page.image));

          if (page.image) {
            image.src = getAssetSource(page.image);
            image.alt = `تصویر ${numberToPersian(pageIndex)} داستان`;
          } else {
            image.removeAttribute("src");
            image.alt = "";
          }

          [...dots.children].forEach((dot, index) => {
            dot.classList.toggle("is-active", index === pageIndex);
          });
        };

        const scrollFeedToBottom = (feed, behavior = "smooth") => {
          feed.scrollTo({ top: feed.scrollHeight, behavior });
        };

        const wait = (milliseconds) => new Promise((resolve) => {
          window.setTimeout(resolve, milliseconds);
        });

        const typingDelay = (character, characterKind) => {
          if (characterKind === "intro-prologue") {
            if (/\s/u.test(character)) return 8;
            if (/[.!؟!…]/u.test(character)) return 390;
            if (/[،؛:]/u.test(character)) return 220;
            return 48;
          }

          if (characterKind === "kherkol") {
            if (/\s/u.test(character)) return 24;
            if (/[.!؟!?…]/u.test(character)) return 760;
            if (/[،؛:]/u.test(character)) return 480;
            return 190;
          }

          if (/\s/u.test(character)) return 10;
          if (/[.!؟!?…]/u.test(character)) return 310;
          if (/[،؛:]/u.test(character)) return 190;
          return 68;
        };

        let quakeVersion = 0;

        const triggerPageQuake = () => {
          const version = ++quakeVersion;
          document.body.classList.remove("is-shaking");
          void document.body.offsetWidth;
          document.body.classList.add("is-shaking");

          window.setTimeout(() => {
            if (version === quakeVersion) {
              document.body.classList.remove("is-shaking");
            }
          }, 620);
        };

        const createEntryRow = (entry) => {
          const row = document.createElement("div");
          row.className = `story-entry ${entry.kind}`;

          if (entry.kind === "cave-options") {
            const choices = document.createElement("div");
            choices.className = "cave-choice-grid";

            for (let number = 1; number <= 4; number += 1) {
              const choice = document.createElement("a");
              choice.className = "cave-choice-button";
              choice.href = entry.url;
              choice.textContent = String(number);
              choice.setAttribute("aria-label", `ورود به غار ${number}`);
              choices.append(choice);
            }

            row.append(choices);
            return { row, bubble: null };
          }

          const bubble = document.createElement("div");
          bubble.className = "message-bubble";

          const avatarSource = messageAvatars[entry.kind];
          if (avatarSource) {
            const avatar = document.createElement("img");
            avatar.className = "message-avatar";
            avatar.src = getAssetSource(avatarSource);
            avatar.alt = "";
            avatar.setAttribute("aria-hidden", "true");
            row.append(avatar);
          }

          row.append(bubble);
          return { row, bubble };
        };

        const appendEntryInstant = (entry, feed) => {
          const { row, bubble } = createEntryRow(entry);
          row.classList.add("is-instant");
          if (bubble) bubble.textContent = entry.text;
          feed.append(row);
        };

        const renderCompletedEntries = (page, feed) => {
          feed.replaceChildren();
          page.entries.forEach((entry) => appendEntryInstant(entry, feed));
          feed.classList.add("is-complete");
          feed.scrollTop = feed.scrollHeight;
        };

        const appendEntry = async (entry, version, feed, scene) => {
          const { row, bubble } = createEntryRow(entry);
          feed.append(row);
          window.requestAnimationFrame(() => scrollFeedToBottom(feed));

          if (!bubble) return true;

          let didStartTyping = false;
          for (const character of entry.text) {
            if (version !== playbackVersion) return false;

            if (!didStartTyping) {
              didStartTyping = true;

              if (entry.effect === "shake") {
                triggerPageQuake();
              }

              if (entry.effect === "dread") {
                row.classList.add("is-impact-message");
                scene.classList.add("is-dread-active");
              }
            }

            bubble.textContent += character;
            feed.scrollTop = feed.scrollHeight;
            await wait(typingDelay(character, entry.kind));
          }

          if (entry.effect === "dread") {
            window.setTimeout(() => {
              if (version === playbackVersion) {
                scene.classList.remove("is-dread-active");
              }
            }, 640);
          }

          return version === playbackVersion;
        };

        const appendIntroAction = (feed) => {
          if (feed.querySelector(".intro-start-button")) return;

          const action = document.createElement("div");
          action.className = "intro-action";

          const button = document.createElement("button");
          button.className = "story-button intro-start-button";
          button.type = "button";
          button.textContent = "شروع";

          action.append(button);
          feed.append(action);
        };

        const finishPage = (page, pageIndex, feed) => {
          completedPages.add(pageIndex);
          nextButton.disabled = Boolean(page.final);
          previousButton.disabled = false;
          replayButton.hidden = Boolean(page.intro);
          replayButton.disabled = false;

          if (page.intro) {
            appendIntroAction(feed);
          }

          feed.classList.add("is-complete");
          feed.scrollTop = feed.scrollHeight;
        };

        const playEntries = async (page, pageIndex, version, feed, scene) => {
          for (const entry of page.entries) {
            const completed = await appendEntry(entry, version, feed, scene);
            if (!completed) return;
            await wait(entry.delayAfter ?? 1000);
          }

          if (version === playbackVersion) {
            finishPage(page, pageIndex, feed);
          }
        };

        const startSceneContent = (scene, pageIndex, version) => {
          const page = pages[pageIndex];
          const { feed } = getSceneParts(scene);

          if (completedPages.has(pageIndex)) {
            renderCompletedEntries(page, feed);
            finishPage(page, pageIndex, feed);
            return;
          }

          void playEntries(page, pageIndex, version, feed, scene);
        };

        const startPage = (scene, pageIndex, version = ++playbackVersion) => {
          const page = pages[pageIndex];
          prepareScene(scene, page, pageIndex);
          syncControls(page, pageIndex);
          startSceneContent(scene, pageIndex, version);
        };

        const transitionTo = (targetIndex, direction) => {
          if (isSliding || targetIndex < 0 || targetIndex >= pages.length) return;

          isSliding = true;
          if (currentPage > 0 && !completedPages.has(currentPage)) {
            completedPages.add(currentPage);
          }
          const version = ++playbackVersion;
          const outgoingScene = activeScene;
          const incomingScene = sceneBlueprint.cloneNode(true);
          const enteringClass = direction === "next" ? "enter-from-left" : "enter-from-right";
          const exitingClass = direction === "next" ? "exit-to-right" : "exit-to-left";

          currentPage = targetIndex;
          incomingScene.classList.add(enteringClass);
          prepareScene(incomingScene, pages[currentPage], currentPage);
          syncControls(pages[currentPage], currentPage, true);
          sceneViewport.append(incomingScene);

          void incomingScene.offsetWidth;
          window.requestAnimationFrame(() => {
            incomingScene.classList.remove(enteringClass);
            outgoingScene.classList.add(exitingClass);
          });

          window.setTimeout(() => {
            if (version !== playbackVersion || !incomingScene.isConnected) return;

            outgoingScene.remove();
            incomingScene.id = "active-scene";
            activeScene = incomingScene;
            isSliding = false;
            previousButton.disabled = false;
            startSceneContent(activeScene, currentPage, version);
          }, slideDuration);
        };

        const transitionFromIntro = () => {
          if (isSliding || currentPage !== 0 || !completedPages.has(0)) return;

          isSliding = true;
          const version = ++playbackVersion;
          const outgoingScene = activeScene;
          const incomingScene = sceneBlueprint.cloneNode(true);

          currentPage = 1;
          incomingScene.classList.add("intro-reveal-scene");
          prepareScene(incomingScene, pages[currentPage], currentPage);
          syncControls(pages[currentPage], currentPage, true);
          sceneViewport.append(incomingScene);

          void incomingScene.offsetWidth;
          window.requestAnimationFrame(() => {
            outgoingScene.classList.add("is-intro-wiping");
          });

          window.setTimeout(() => {
            if (version !== playbackVersion || !incomingScene.isConnected) return;

            outgoingScene.remove();
            void incomingScene.offsetWidth;
            incomingScene.classList.add("is-revealing");

            window.setTimeout(() => {
              if (version !== playbackVersion || !incomingScene.isConnected) return;

              incomingScene.classList.remove("intro-reveal-scene", "is-revealing");
              incomingScene.id = "active-scene";
              activeScene = incomingScene;
              isSliding = false;
              startSceneContent(activeScene, currentPage, version);
            }, introRevealDuration);
          }, introWipeDuration);
        };

        nextButton.addEventListener("click", () => {
          if (currentPage === 0) {
            transitionFromIntro();
            return;
          }

          transitionTo(currentPage + 1, "next");
        });

        sceneViewport.addEventListener("click", (event) => {
          if (!event.target.closest(".intro-start-button")) return;
          transitionFromIntro();
        });

        previousButton.addEventListener("click", () => {
          transitionTo(currentPage - 1, "previous");
        });

        replayButton.addEventListener("click", () => {
          if (isSliding || currentPage === 0) return;

          const version = ++playbackVersion;
          completedPages.delete(currentPage);
          prepareScene(activeScene, pages[currentPage], currentPage);
          syncControls(pages[currentPage], currentPage, false, true);
          startSceneContent(activeScene, currentPage, version);
        });

        void preloadStoryAssets().finally(() => {
          loadingScreen.classList.add("is-complete");
          window.setTimeout(() => startPage(activeScene, currentPage), 620);
        });
      })();
    </script>
  </body>
</html>
