<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d">
  <title id="t">انتقال انرژی فوتون به الکترون</title><desc id="d">پرتوهای نور خورشید به یک الکترون در سیلیکون انرژی می‌دهند و آن را به حرکت درمی‌آورند.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1"><stop stop-color="#0e2320"/><stop offset="1" stop-color="#090d13"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#ffe65a" stop-opacity="0"/><stop offset="1" stop-color="#ffe65a"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#73f67b"/></marker>
    <marker id="photon-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#ffe65a"/></marker>
  </defs>
  <rect width="900" height="390" rx="25" fill="url(#sky)"/>
  <g filter="url(#glow)"><circle cx="118" cy="111" r="49" fill="#ffe65a"/><g stroke="#ffe65a" stroke-width="7" stroke-linecap="round"><path d="M118 33V12"/><path d="M45 111H21"/><path d="M191 111H215"/><path d="M66 59L48 41"/><path d="M170 59L188 41"/><path d="M66 162L48 180"/><path d="M170 162L188 180"/></g></g>
  <g stroke="url(#beam)" stroke-width="12" stroke-linecap="round"><path d="M183 85L410 160"/><path d="M184 117L410 181"/><path d="M180 148L410 209"/></g>
  <text x="70" y="208" fill="#fff0a4" font-family="Tahoma, sans-serif" font-size="24" font-weight="700">نور خورشید / فوتون</text>
  <g stroke="#4ea4ff" stroke-width="3" opacity=".84"><ellipse cx="510" cy="198" rx="116" ry="41" transform="rotate(-28 510 198)"/><ellipse cx="510" cy="198" rx="116" ry="41" transform="rotate(35 510 198)"/></g>
  <circle cx="510" cy="198" r="37" fill="#ff69bd" opacity=".86"/><circle cx="495" cy="189" r="17" fill="#ffe65a"/><circle cx="526" cy="204" r="17" fill="#4ea4ff"/>
  <circle cx="430" cy="154" r="15" fill="#73f67b" filter="url(#glow)"/>
  <path d="M412 180L519 201" fill="none" stroke="#ffe65a" stroke-width="6" marker-end="url(#photon-arrow)"/>
  <path d="M544 196C630 109 688 108 743 138" fill="none" stroke="#73f67b" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="780" cy="145" r="16" fill="#73f67b" filter="url(#glow)"/>
  <text x="574" y="84" fill="#a6f9ad" font-family="Tahoma, sans-serif" font-size="24" font-weight="700">الکترون آزاد می‌شود</text>
  <text x="393" y="342" fill="#bfd0c9" font-family="Tahoma, sans-serif" font-size="22">سیلیکون</text>
</svg>
