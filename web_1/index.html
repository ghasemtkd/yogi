    <script>
      (() => {
        const locationUrl = new URL(window.location.href);
        const lowerPath = locationUrl.pathname.toLowerCase();
        // Make relative assets work both at /web_1 and at /web_1/2.
        // Static hosts often serve the former without a trailing slash.
        const markerMatch = lowerPath.match(/^(.*\/web_1)(?:\/|$)/);
        let basePath = "";

        if (markerMatch) {
          basePath = `${locationUrl.pathname.slice(0, markerMatch[1].length)}/`;
        } else {
          const numericRoute = locationUrl.pathname.match(/^(.*\/)\d+\/?$/);
          if (numericRoute) basePath = numericRoute[1];
        }

        if (basePath) {
          const baseUrl = new URL(locationUrl.href);
          baseUrl.pathname = basePath;
          baseUrl.search = "";
          baseUrl.hash = "";
          const base = document.createElement("base");
          base.href = baseUrl.href;
          document.head.append(base);
        }
      })();
    </script>

    <style>
      @font-face {
        font-family: "YogitoUI";
        src: url("yogiyar-ui.woff2") format("woff2");
        font-weight: 100 900;

      :root {
        color-scheme: dark;
        --ink: #c7bfae;
        --muted: #918a7d;
        --violet: #5d5141;
        --mint: #68614f;
        --night: #050403;
        --line: rgba(196, 181, 147, 0.1);
        --glass: rgba(10, 8, 6, 0.86);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: "YogitoUI", Vazirmatn, "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 50% 112%, rgba(56, 40, 24, 0.25), transparent 42rem),
          radial-gradient(circle at 4% 2%, rgba(63, 56, 39, 0.08), transparent 27rem),
          radial-gradient(circle at 96% 18%, rgba(62, 50, 31, 0.1), transparent 30rem),
          var(--night);
      }

      body.torch-found {
        --ink: #d1c7b5;
        --muted: #aaa08e;
      }

      body.torch-held {
        --ink: #e0d4bc;
        --muted: #c0b39c;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: .2;
        background-image:
          repeating-linear-gradient(102deg, rgba(188, 166, 124, .035) 0 1px, transparent 1px 5px),
          repeating-linear-gradient(12deg, rgba(0, 0, 0, .22) 0 2px, transparent 2px 11px);
        background-size: 74px 74px, 105px 105px;
        mask-image: radial-gradient(ellipse at center, black, transparent 83%);
      }

      .orbit {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .orb {
        --rise: -22px;
        position: absolute;
        opacity: .42;
        border: 1px solid rgba(186, 166, 124, .11);
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(151, 132, 93, .06), rgba(41, 34, 23, .01));
        box-shadow: inset 0 1px 1px rgba(215, 194, 151, .08), 0 18px 44px rgba(0, 0, 0, .35);
        backdrop-filter: blur(12px);
        will-change: transform;
        animation: bubble-drift var(--float-duration, 11s) cubic-bezier(.45, .05, .55, .95) infinite alternate both;
      }

      .orb.one {
        width: 13rem;
        height: 13rem;
        top: -4rem;
        right: -4rem;
        --rise: -28px;
        --float-duration: 13s;
        animation-delay: -8s;
      }

      .orb.two {
        width: 6.5rem;
        height: 6.5rem;
        top: 14%;
        left: 8%;
        --rise: 19px;
        --float-duration: 10s;
        animation-delay: -5s;
      }

      .orb.three {
        width: 4.1rem;
        height: 4.1rem;
        right: 14%;
        bottom: 13%;
        --rise: -17px;
        --float-duration: 9s;
        animation-delay: -3s;
      }

      .orb.four {
        width: 9.5rem;
        height: 9.5rem;
        bottom: -3.5rem;
        left: -3.5rem;
        --rise: 23px;
        --float-duration: 14s;
        animation-delay: -10s;
      }

      .site {
        position: relative;
        z-index: 3;
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: clamp(.7rem, 2.5vw, 1.4rem);
      }

      .story-shell {
        position: relative;
        display: grid;
        width: min(100%, 940px);
        height: min(100dvh, 800px);
        min-height: 0;
        place-items: center;
        padding: clamp(3.2rem, 6.4vh, 4.7rem) 0 clamp(4.2rem, 7.4vh, 5.2rem);
      }

      .halo {
        position: absolute;
        z-index: -1;
        width: 76%;
        height: 67%;
        top: 17%;
        left: 12%;
        border-radius: 50%;
        filter: blur(58px);
        background: linear-gradient(105deg, rgba(69, 53, 34, .22), rgba(44, 37, 23, .08));
        transition: opacity 1.2s ease, filter 1.2s ease;
      }

      body.torch-found .halo {
        opacity: .78;
        filter: blur(63px);
      }

      body.torch-held .halo {
        opacity: 1;
        filter: blur(70px);
      }

      .story-card {
        position: relative;
        display: block;
        width: min(89vw, 820px);
        height: min(75dvh, 660px);
        min-height: 0;
        overflow: hidden;
        isolation: isolate;
        border: 1px solid var(--line);
        border-radius: clamp(2rem, 5vw, 3.2rem);
        background:
          linear-gradient(130deg, rgba(220, 193, 140, .035), transparent 31%),
          var(--glass);
        box-shadow:
          inset 0 1px 1px rgba(224, 205, 165, .12),
          inset 0 -28px 72px rgba(0, 0, 0, .34),
          0 38px 100px rgba(0, 0, 0, .48);
        backdrop-filter: blur(23px) saturate(92%);
        transition: border-color 1.15s ease, box-shadow 1.15s ease, background 1.15s ease;
      }

      body.torch-found .story-card {
        border-color: rgba(219, 151, 60, .2);
        box-shadow: inset 0 1px rgba(255, 213, 139, .12), inset 0 -28px 72px rgba(0, 0, 0, .3), 0 38px 100px rgba(0, 0, 0, .48), 0 0 44px rgba(188, 105, 31, .08);
      }

      body.torch-held .story-card {
        border-color: rgba(235, 171, 73, .34);
        box-shadow: inset 0 1px rgba(255, 227, 168, .2), inset 0 -28px 72px rgba(0, 0, 0, .26), 0 38px 100px rgba(0, 0, 0, .47), 0 0 58px rgba(222, 126, 35, .14);
      }

      .story-card::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 21rem;
        height: 21rem;
        top: -14rem;
        left: -10rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(91, 67, 36, .15), transparent 68%);
      }

      .cave-remains {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .cave-remains::before,
      .cave-remains::after {
        content: "";
        position: absolute;
        opacity: .32;
        filter: blur(.35px);
        background-repeat: no-repeat;
      }

      .cave-remains::before {
        width: 25rem;
        height: 17rem;
        right: -7rem;
        bottom: -4.5rem;
        transform: rotate(-18deg);
        background-image:
          radial-gradient(ellipse at 30% 35%, rgba(191, 171, 131, .14) 0 11%, transparent 12%),
          radial-gradient(ellipse at 43% 35%, rgba(191, 171, 131, .14) 0 11%, transparent 12%),
          radial-gradient(ellipse at 36.5% 48%, rgba(191, 171, 131, .12) 0 10%, transparent 11%),
          repeating-linear-gradient(90deg, transparent 0 1.7rem, rgba(188, 166, 124, .11) 1.75rem 2.2rem, transparent 2.25rem 3.5rem);
        background-size: 8rem 8rem, 8rem 8rem, 8rem 8rem, 23rem 1.2rem;
        background-position: 1.6rem 0, 5.3rem 0, 3.5rem 3.2rem, 0 9.2rem;
      }

      .cave-remains::after {
        width: 20rem;
        height: 15rem;
        left: -7rem;
        top: 19%;
        transform: rotate(23deg);
        background-image:
          radial-gradient(ellipse at 42% 35%, rgba(186, 164, 124, .1) 0 12%, transparent 13%),
          radial-gradient(ellipse at 58% 35%, rgba(186, 164, 124, .1) 0 12%, transparent 13%),
          linear-gradient(26deg, transparent 45%, rgba(186, 164, 124, .12) 46% 53%, transparent 54%),
          linear-gradient(-35deg, transparent 45%, rgba(186, 164, 124, .11) 46% 53%, transparent 54%);
      }

      .spirit-layer {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .spirit {
        position: absolute;
        width: clamp(3.2rem, 7vw, 6.2rem);
        height: clamp(7rem, 15vw, 12rem);
        border-radius: 48% 48% 32% 32%;
        opacity: 0;
        filter: blur(3px);
        background:
          radial-gradient(circle at 34% 31%, rgba(213, 230, 222, .72) 0 .06rem, transparent .08rem),
          radial-gradient(circle at 66% 31%, rgba(213, 230, 222, .72) 0 .06rem, transparent .08rem),
          radial-gradient(ellipse at 50% 42%, rgba(177, 205, 194, .24), transparent 48%),
          linear-gradient(180deg, rgba(173, 204, 194, .16), rgba(91, 116, 108, .025));

      }

      .spirit::after {
        content: "";
        position: absolute;
        right: -12%;
        bottom: -1.3rem;
        left: -12%;
        height: 2.6rem;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 0, rgba(177, 205, 194, .14), transparent 69%);
      }

      .spirit.one { top: 26%; left: 10%; --spirit-time: 21s; animation-delay: -8s; }
      .spirit.two { right: 8%; bottom: 19%; width: clamp(2.8rem, 6vw, 5.2rem); height: clamp(6rem, 13vw, 10rem); --spirit-time: 18s; animation-delay: -12s; }
      .spirit.three { top: 12%; right: 27%; width: clamp(2.2rem, 4vw, 4rem); height: clamp(5rem, 10vw, 8rem); --spirit-time: 24s; animation-delay: -16s; }

      body.torch-found .spirit { opacity: .16; filter: blur(2.4px); }
      body.torch-held .spirit { opacity: .3; filter: blur(1.8px); }
      body.torch-carried .spirit { opacity: .22; filter: blur(2px); }

      .darkness-veil {
        position: fixed;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        opacity: .94;
        background:
          radial-gradient(ellipse at 50% 48%, transparent 0 13%, rgba(0, 0, 0, .38) 46%, rgba(0, 0, 0, .92) 100%),
          rgba(0, 0, 0, .72);
        transition: opacity 1.4s ease, background 1.4s ease;
      }

      body.torch-found .darkness-veil { opacity: .48; }
      body.torch-held .darkness-veil { opacity: .22; }
      body.torch-carried .darkness-veil { opacity: .3; }

      .spider-hanger {
        position: fixed;
        z-index: 5;
        top: 0;
        left: 50%;
        width: 4.4rem;
        height: clamp(5.5rem, 14vh, 9.5rem);
        pointer-events: none;
        opacity: .22;
        transform: translateX(-50%);
        transition: opacity 1.2s ease;
      }

      .spider-thread {
        position: absolute;
        top: 0;
        left: 50%;
        width: 1px;
        height: 72%;
        background: linear-gradient(180deg, rgba(210, 203, 186, .44), rgba(166, 153, 125, .08));
        box-shadow: 0 0 4px rgba(234, 218, 177, .16);
        transform-origin: top center;
        animation: thread-sway 8.5s ease-in-out infinite;
      }

      .spider {
        position: absolute;
        top: 67%;
        left: 50%;
        width: 2.8rem;
        height: 2.35rem;
        border: 1px solid rgba(190, 162, 112, .4);
        border-radius: 48% 48% 44% 44%;
        background: radial-gradient(circle at 50% 34%, rgba(88, 67, 43, .92), rgba(14, 11, 8, .98) 68%);
        box-shadow: 0 0 16px rgba(170, 87, 30, .18), inset 0 1px rgba(239, 201, 139, .17);
        transform: translateX(-50%);
        animation: spider-sway 8.5s ease-in-out infinite;
      }

      .spider-leg {
        position: absolute;
        width: 2.35rem;
        height: 1px;
        background: rgba(189, 158, 107, .42);
        box-shadow: 0 0 3px rgba(226, 189, 125, .12);
        transform-origin: center right;
      }

      .spider-leg.left { right: 1.95rem; }
      .spider-leg.right { left: 1.95rem; transform-origin: center left; }
      .spider-leg.leg-1 { top: .38rem; transform: rotate(-31deg); }
      .spider-leg.leg-2 { top: .84rem; transform: rotate(-12deg); }
      .spider-leg.leg-3 { top: 1.32rem; transform: rotate(12deg); }
      .spider-leg.leg-4 { top: 1.76rem; transform: rotate(31deg); }
      .spider-leg.right.leg-1 { transform: rotate(31deg); }
      .spider-leg.right.leg-2 { transform: rotate(12deg); }
      .spider-leg.right.leg-3 { transform: rotate(-12deg); }
      .spider-leg.right.leg-4 { transform: rotate(-31deg); }

      .spider-eye {
        position: absolute;
        z-index: 2;
        top: .72rem;
        width: .32rem;
        height: .32rem;
        border-radius: 50%;
        background: #d39b56;
        box-shadow: 0 0 7px rgba(235, 156, 67, .9), 0 0 13px rgba(164, 67, 25, .55);
        animation: spider-look 10s ease-in-out infinite;
      }

      .spider-eye.left { left: .76rem; animation-delay: -1.4s; }
      .spider-eye.right { right: .76rem; animation-delay: -2.1s; }

      body.torch-found .spider-hanger { opacity: .52; }
      body.torch-held .spider-hanger { opacity: .78; }

      .torch-light {
        position: absolute;
        z-index: 3;
        inset: 0;
        width: auto;
        height: auto;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transform: none;
        background: radial-gradient(ellipse at 50% 106%, rgba(255, 226, 151, .54) 0, rgba(242, 153, 54, .24) 19%, rgba(160, 82, 23, .09) 43%, transparent 72%);
        mix-blend-mode: screen;
        filter: blur(5px);
        transition: opacity 1.15s ease, filter 1.15s ease;
      }

      .torch-light::after {
        content: "";
        position: absolute;
        top: auto;
        bottom: 2%;
        left: 50%;
        width: 1.15rem;
        height: 2.3rem;
        border-radius: 50% 50% 46% 46%;
        background: radial-gradient(ellipse at 50% 72%, rgba(255, 246, 193, .9), rgba(255, 169, 52, .62) 45%, transparent 74%);
        filter: blur(2px);
        transform: translateX(-50%);
        animation: flame-waver 1.8s ease-in-out infinite;
      }

      body.torch-found .torch-light {
        opacity: .36;
        filter: blur(4px);
        animation: torch-flicker-found 4.5s ease-in-out infinite;
      }

      body.torch-held .torch-light {
        opacity: .64;
        filter: blur(3px);
        animation: torch-flicker-held 3.2s ease-in-out infinite;
      }

      body.torch-carried .torch-light { opacity: 0; }

      .scene-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: pan-y;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(9.5rem, .92fr) minmax(0, 1.08fr);
        will-change: transform;
        transition: transform .92s cubic-bezier(.16, .84, .22, 1);
      }

      .scene.enter-from-right { transform: translate3d(100%, 0, 0); }
      .scene.enter-from-left { transform: translate3d(-100%, 0, 0); }
      .scene.exit-to-left { transform: translate3d(-100%, 0, 0); }
      .scene.exit-to-right { transform: translate3d(100%, 0, 0); }

      .media-pane {
        min-height: 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(255, 255, 255, .1);
        background: rgba(3, 5, 9, .64);
        cursor: grab;
      }

      .media-pane:active { cursor: grabbing; }

      .image-shell {
        position: relative;
        display: grid;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 35%, rgba(94, 67, 35, .1), transparent 62%),
          #030302;
      }

      .image-shell::after {
        content: "";
        position: absolute;
        z-index: 4;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 214, 153, .04), transparent 24%, transparent 75%, rgba(255, 189, 96, .025));
      }

      .story-image {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: fill;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform, opacity;
        filter: brightness(.14) saturate(.24) contrast(1.12);
        transition: transform .88s cubic-bezier(.16, .84, .22, 1), opacity .88s ease, filter 1.15s ease;
        background: #05070b;
      }

      body.torch-found .story-image {
        filter: brightness(.58) saturate(.7) contrast(1.06);
      }

      body.torch-held .story-image {
        filter: brightness(.91) saturate(.9) contrast(1.03);
      }

      body.torch-carried .story-image {
        filter: brightness(.78) saturate(.8) contrast(1.05);
      }

      .scene:not(.has-image) .media-pane { display: none; }
      .scene:not(.has-image) { grid-template-rows: minmax(0, 1fr); }
      .scene.has-image .story-image.is-image-enter-left,
      .scene.has-image .story-image.is-image-enter-right { z-index: 2; }

      .story-image.is-image-enter-left { transform: translate3d(-100%, 0, 0); }
      .story-image.is-image-enter-right { transform: translate3d(100%, 0, 0); }
      .story-image.is-image-exit-left { transform: translate3d(-100%, 0, 0); }
      .story-image.is-image-exit-right { transform: translate3d(100%, 0, 0); }

      .story-image.is-image-settled {
        transform: translate3d(0, 0, 0);
      }

      .copy-pane {
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
        padding: clamp(1.1rem, 3vw, 2rem) clamp(.9rem, 3.6vw, 2.3rem);
        text-align: center;
      }

      .story-feed {
        display: flex;
        min-height: 0;
        flex-direction: column;
        gap: .58rem;
        overflow: hidden;
        padding: .35rem .08rem .5rem;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
        pointer-events: none;
      }

      .story-feed.is-complete {
        overflow-x: hidden;
        overflow-y: auto;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(174, 137, 82, .48) transparent;
      }

      .story-feed.is-complete::-webkit-scrollbar { width: .38rem; }
      .story-feed.is-complete::-webkit-scrollbar-track { background: transparent; }
      .story-feed.is-complete::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(174, 137, 82, .42);
      }

      .story-entry {
        display: flex;
        align-items: center;
        width: 100%;
        direction: ltr;
        animation: message-arrive .42s cubic-bezier(.2, .8, .2, 1) both;
      }

      .story-entry.is-instant { animation: none; }

      .message-avatar {
        flex: 0 0 auto;
        width: clamp(1.85rem, 4.5vw, 2.55rem);
        aspect-ratio: 1;
        display: block;
        object-fit: contain;
        object-position: center;
      }

      .message-bubble {
        max-width: min(85%, 31rem);
        padding: .58rem .82rem;
        border: 1px solid rgba(226, 235, 246, .13);
        border-radius: 1.15rem;
        direction: rtl;
        color: var(--ink);
        font-size: clamp(.7rem, 1.7vw, .9rem);
        line-height: 1.7;
        text-align: right;
        overflow-wrap: anywhere;
        backdrop-filter: blur(18px) saturate(135%);
      }

      .story-entry.yogi {
        justify-content: flex-end;
      }

      .story-entry.yogi .message-bubble {
        border-color: rgba(181, 162, 124, .25);
        border-top-right-radius: .38rem;
        color: #d6cbb8;
        background: linear-gradient(135deg, rgba(59, 55, 48, .8), rgba(26, 25, 22, .77));
        box-shadow: inset 0 1px rgba(224, 207, 172, .1), 0 9px 24px rgba(0, 0, 0, .24);
      }

      body.torch-held .story-entry.yogi .message-bubble {
        border-color: rgba(227, 161, 72, .34);
        color: #ead9bf;
        background: linear-gradient(135deg, rgba(92, 66, 36, .78), rgba(40, 33, 23, .77));
      }

      .story-entry.yogi .message-avatar {
        order: 2;
        margin-left: .48rem;
      }

      .story-entry.narration,
      .story-entry.chapter,
      .story-entry.clue {
        justify-content: center;
      }

      .story-entry.narration .message-bubble {
        max-width: 92%;
        padding: .08rem .5rem;
        border: 0;
        color: var(--muted);
        background: transparent;
        box-shadow: none;
        font-size: clamp(.67rem, 1.55vw, .82rem);
        line-height: 1.72;
        text-align: center;
      }

      .story-entry.chapter .message-bubble {
        max-width: 96%;
        padding: .18rem .55rem .4rem;
        border: 0;
        color: var(--ink);
        background: transparent;
        box-shadow: none;
        font-size: clamp(1.05rem, 3.5vw, 1.75rem);
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -.035em;
        text-align: center;
      }

      .story-entry.clue .message-bubble {
        min-width: min(72%, 18rem);
        padding: .8rem 1.2rem;
        border-color: rgba(190, 157, 100, .34);
        border-radius: 1.25rem;
        color: #d9cdb8;
        direction: ltr;
        background:
          linear-gradient(135deg, rgba(230, 200, 146, .08), transparent 40%),
          linear-gradient(145deg, rgba(72, 58, 38, .7), rgba(35, 29, 21, .72));
        box-shadow: inset 0 1px rgba(230, 211, 177, .12), 0 14px 32px rgba(0, 0, 0, .28);
        font-size: clamp(1.2rem, 4vw, 1.85rem);
        font-weight: 950;
        letter-spacing: .2em;
        text-align: center;
      }

      .controls {
        position: absolute;
        right: 0;
        bottom: clamp(.2rem, 2.4vh, 1rem);
        left: 0;
        height: 3.5rem;
      }

      .story-button {
        position: absolute;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: clamp(7.6rem, 20vw, 10.2rem);
        height: 3.25rem;
        padding: 0 1.15rem;
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 1.15rem;
        color: #fff;
        font: inherit;
        font-size: clamp(.78rem, 1.8vw, .94rem);
        font-weight: 850;
        cursor: pointer;
        transition: transform .25s ease, background .25s ease, border-color .25s ease, opacity .25s ease;
        backdrop-filter: blur(18px) saturate(135%);
      }

      .story-button:hover { transform: translateY(-3px); }
      .story-button:active { transform: translateY(-1px) scale(.98); }

      .next-button {
        right: 0;
        color: #e4d4bb;
        background: linear-gradient(135deg, rgba(90, 64, 35, .94), rgba(39, 30, 20, .94));
        box-shadow: inset 0 1px rgba(247, 220, 166, .14), 0 14px 30px rgba(0, 0, 0, .34);
      }

      .previous-button {
        left: 0;
        color: #c6b9a3;
        background: rgba(35, 29, 22, .82);
        box-shadow: inset 0 1px rgba(255, 255, 255, .14), 0 12px 26px rgba(0, 0, 0, .17);
      }

      .replay-button {
        right: 50%;
        color: #cdbfA8;
        background: rgba(43, 35, 25, .84);
        box-shadow: inset 0 1px rgba(225, 206, 169, .11), 0 12px 26px rgba(0, 0, 0, .24);
        transform: translateX(50%);
      }

      .replay-button:hover { transform: translateX(50%) translateY(-3px); }
      .replay-button:active { transform: translateX(50%) translateY(-1px) scale(.98); }

      .story-button[disabled] {
        cursor: default;
        opacity: .52;
        filter: saturate(.62);
      }

      .story-button[disabled]:hover { transform: none; }
      .story-button[hidden] { display: none; }

      .loading-screen {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        overflow: hidden;
        place-items: center;
        background: #050608;
        transition: opacity .72s ease, visibility .72s ease;
      }

      .loading-screen.is-complete {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .loading-image {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        object-fit: fill;
        object-position: center;
        background: #050608;
        opacity: .9;
      }

      .loading-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(5, 6, 9, .12), rgba(5, 6, 9, .52)),
          radial-gradient(circle at 50% 50%, transparent 16%, rgba(5, 6, 9, .22) 100%);
      }

      .loading-status {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: .72rem;
      }

      .loader {
        height: 15px;
        aspect-ratio: 4;
        --_g: no-repeat radial-gradient(farthest-side, #fff 90%, transparent);
        display: grid;
        background: var(--_g) left, var(--_g) right;
        background-size: 25% 100%;
        filter: drop-shadow(0 0 9px rgba(255, 255, 255, .92)) drop-shadow(0 0 24px rgba(226, 242, 255, .74));
      }

      .loader::before,
      .loader::after {
        content: "";
        grid-area: 1 / 1;
        height: inherit;
        aspect-ratio: 1;
        margin: auto;
        border-radius: 50%;
        transform-origin: -100% 50%;
        background: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, .95), 0 0 26px rgba(221, 241, 255, .75);
        animation: loader-orbit 1s infinite linear;
      }

      .loader::after {
        transform-origin: 200% 50%;
        --spin: -1;
        animation-delay: -.5s;
      }

      .loading-percent {
        display: inline-flex;
        direction: ltr;
        align-items: baseline;
        justify-content: center;
        min-width: 4rem;
        color: rgba(255, 255, 255, .96);
        font-size: clamp(.8rem, 2.4vw, 1rem);
        font-weight: 900;
        letter-spacing: .035em;
        text-shadow: 0 0 12px rgba(255, 255, 255, .92), 0 0 28px rgba(216, 237, 255, .62);
      }

      @keyframes bubble-drift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(0, var(--rise), 0); }
      }

      @keyframes message-arrive {
        from { opacity: 0; transform: translateY(12px) scale(.975); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes loader-orbit {
        58%, 100% { transform: rotate(calc(var(--spin, 1) * 1turn)); }
      }

      @keyframes torch-flicker-found {
        0%, 100% { opacity: .36; }
        35% { opacity: .29; }
        52% { opacity: .4; }
        76% { opacity: .33; }
      }

      @keyframes torch-flicker-held {
        0%, 100% { opacity: .64; }
        35% { opacity: .53; }
        52% { opacity: .7; }
        76% { opacity: .59; }
      }

      @keyframes spirit-drift {
        0% { transform: translate3d(-.8rem, .6rem, 0) rotate(-2deg); }
        48% { transform: translate3d(1.1rem, -1.4rem, 0) rotate(2deg); }
        100% { transform: translate3d(-.4rem, -2.2rem, 0) rotate(-1deg); }
      }

      @keyframes thread-sway {
        0%, 100% { transform: rotate(-1.2deg); }
        46% { transform: rotate(1.4deg); }
        72% { transform: rotate(.2deg); }
      }

      @keyframes spider-sway {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(-1deg); }
        46% { transform: translateX(-50%) translateY(.28rem) rotate(1.4deg); }
        72% { transform: translateX(-50%) translateY(.08rem) rotate(0deg); }
      }

      @keyframes spider-look {
        0%, 18% { transform: translateX(-.1rem); }
        19%, 39% { transform: translateX(.14rem); }
        40%, 58% { transform: translateX(.14rem); }
        59%, 79% { transform: translateX(-.13rem); }
        80%, 100% { transform: translateX(-.13rem); }
      }

      @keyframes flame-waver {
        0%, 100% { transform: translateX(-50%) scale(.9, 1); opacity: .78; }
        42% { transform: translateX(-50%) scale(1.12, .86) rotate(2deg); opacity: 1; }
        72% { transform: translateX(-50%) scale(.82, 1.12) rotate(-2deg); opacity: .68; }
      }

      @media (max-width: 580px) {
        .story-card { width: 92vw; }
        .copy-pane { padding-inline: .8rem; }
        .story-button { min-width: clamp(5.9rem, 27vw, 7.2rem); padding-inline: .65rem; }
      }

      @media (max-height: 640px) {
        .story-shell { padding-top: 2.8rem; padding-bottom: 4.2rem; }
        .story-card { height: min(76dvh, 520px); }
        .scene { grid-template-rows: minmax(7.1rem, .84fr) minmax(0, 1.16fr); }
        .scene:not(.has-image) { grid-template-rows: minmax(0, 1fr); }
        .copy-pane { padding: .75rem 1rem; }
        .story-feed { gap: .38rem; }
        .message-bubble { padding: .46rem .67rem; line-height: 1.54; }
        .message-avatar { width: 1.9rem; }
        .controls { height: 3rem; }
        .story-button { height: 2.8rem; min-width: 7.1rem; border-radius: 1rem; }
      }

      @media (max-height: 450px) {
        .story-shell { padding-top: 2rem; padding-bottom: 3.45rem; }
        .story-card { height: min(78dvh, 395px); }
        .scene { grid-template-rows: minmax(5.1rem, .78fr) minmax(0, 1.22fr); }
        .scene:not(.has-image) { grid-template-rows: minmax(0, 1fr); }
        .story-feed { gap: .25rem; }
        .message-bubble { padding: .31rem .5rem; font-size: .6rem; line-height: 1.38; }
        .message-avatar { width: 1.45rem; }
        .story-entry.narration .message-bubble { font-size: .56rem; line-height: 1.38; }
        .story-entry.chapter .message-bubble { font-size: .88rem; }
        .story-button { height: 2.45rem; min-width: 6.25rem; font-size: .68rem; }
      }
    </style>
  </head>
  <body>
    <div class="orbit" aria-hidden="true">
      <span class="orb one"></span>
      <span class="orb two"></span>
      <span class="orb three"></span>
      <span class="orb four"></span>
    </div>
    <div class="cave-remains" aria-hidden="true"></div>
    <div class="spirit-layer" aria-hidden="true">
      <span class="spirit one"></span>
      <span class="spirit two"></span>
      <span class="spirit three"></span>
    </div>
    <div class="darkness-veil" aria-hidden="true"></div>
    <div class="spider-hanger" aria-hidden="true">
      <span class="spider-thread"></span>
      <span class="spider">
        <span class="spider-leg left leg-1"></span>
        <span class="spider-leg left leg-2"></span>
        <span class="spider-leg left leg-3"></span>

        <span class="spider-leg right leg-1"></span>

        <span class="spider-leg right leg-3"></span>

        <span class="spider-eye right"></span>
      </span>
    </div>

    <main class="site">
      <section class="story-shell" aria-label="معمای یوگی">
        <div class="halo" aria-hidden="true"></div>

        <article class="story-card" id="story-card">
          <div class="scene-viewport" id="scene-viewport">
            <section class="scene" id="active-scene">
              <div class="media-pane" aria-label="تصویر داستان">
                <div class="image-shell">
                  <img class="story-image" src="" alt="" draggable="false" />
                  <div class="torch-light" aria-hidden="true"></div>
                </div>
              </div>
              <div class="copy-pane">
                <div class="story-feed" aria-live="polite" aria-label="متن معما"></div>
              </div>
            </section>
          </div>
        </article>

        <nav class="controls" aria-label="کنترل داستان">
          <button class="story-button previous-button" id="previous-button" type="button" hidden>قبلی</button>
          <button class="story-button replay-button" id="replay-button" type="button" hidden>بازخوانی</button>
          <button class="story-button next-button" id="next-button" type="button">ادامه</button>
        </nav>
      </section>
    </main>

    <section class="loading-screen" id="loading-screen" aria-live="polite">
      <img class="loading-image" src="" alt="" />
      <div class="loading-status" role="status" aria-live="polite" aria-label="در حال بارگذاری داستان">
        <div class="loader" aria-hidden="true"></div>
        <div class="loading-percent" aria-label="درصد دریافت فایل ها">
          <span aria-hidden="true">%</span><span id="loading-percent-value">0</span>
        </div>
      </div>
    </section>

    <script>
      (() => {
        "use strict";

        const stories = Object.freeze({
          1: [
            {
              image: "1-1.webp",
              nextLabel: "به زودی",
              final: true,
              autoplay: true,
              entries: [
                { kind: "chapter", text: "به جستجوی نیلا" },
                { kind: "narration", text: "یوگی وارد اولین غار شد.", imageAfter: "1-2.webp" },
                { kind: "narration", text: "با ورود به غار، تاریکی همه جا را فرا گرفته بود. یوگی چند قدم برداشت و اطرافش را نگاه کرد." },
                { kind: "yogi", text: "وای... اینجا چقدر تاریکه!" },
                { kind: "yogi", text: "من که هیچی نمی بینم..." },
                { kind: "narration", text: "کمی جلوتر، نور کوچکی توجه یوگی را جلب کرد.", lightAfter: "found", delayAfter: 1400 },
                { kind: "narration", text: "یوگی با تعجب نزدیک تر شد." },
                { kind: "narration", text: "روی زمین، یک مشعل روشن به صورت کاملاً ایستاده قرار داشت؛ بدون اینکه به جایی تکیه داده باشد." },
                { kind: "yogi", text: "عجیبه..." },
                { kind: "yogi", text: "این چرا این جوری روی زمین ایستاده؟" },
                { kind: "narration", text: "یوگی به مشعل رسید و آن را برداشت.", lightAfter: "held" },
                { kind: "yogi", text: "خب، این حداقل باعث می شه بتونم مسیر رو ببینم." },
                { kind: "narration", text: "یوگی با نور مشعل به مسیرش ادامه داد.", imageAfter: "1-3.webp", lightAfter: "carried" },
                { kind: "narration", text: "کمی جلوتر، نور مشعل روی دیوارهای غار افتاد و یوگی متوجه نوشته های عجیبی شد که روی دیوارها دیده می شد." },
                { kind: "yogi", text: "این نوشته ها دیگه چی ان؟" },
                { kind: "narration", text: "نوشته ها به خط میخی بودند و یوگی چیزی از آن ها نمی فهمید." },
                { kind: "yogi", text: "من که هیچی از اینا سر درنمیارم..." },
                { kind: "narration", text: "او به مسیرش ادامه داد که ناگهان چشمش به یک گنجه افتاد.", delayAfter: 1500 },
                { kind: "yogi", text: "اوه! این دیگه چیه؟" },
                { kind: "narration", text: "یوگی به گنجه نزدیک شد و درِ آن را باز کرد.", imageAfter: "1-4.webp" },
                { kind: "narration", text: "داخل گنجه یک دفتر، دو مداد و یک پاک کن قرار داشت." },
                { kind: "narration", text: "یوگی یکی از مدادها را برداشت." },
                { kind: "yogi", text: "این یکی خیلی استفاده شده..." },
                { kind: "narration", text: "بعد مداد دیگر را نگاه کرد." },
                { kind: "yogi", text: "ولی این یکی کاملاً نوئه!" },
                { kind: "narration", text: "او دفتر را برداشت و شروع به ورق زدن کرد." },
                { kind: "narration", text: "چند صفحه را رد کرد تا به وسط دفتر رسید." },
                { kind: "narration", text: "ناگهان خشکش زد.", delayAfter: 1800 },
                { kind: "yogi", text: "وایسا..." },
                { kind: "yogi", text: "این که..." },
                { kind: "narration", text: "روی یکی از صفحه ها، تصویر همان خرکولی بود که نیلا را دزدیده بود." },
                { kind: "yogi", text: "این همون خرکوله!" },
                { kind: "yogi", text: "یعنی این دفتر از قبل می دونسته که اون اینجا میاد؟", delayAfter: 1600 },
                { kind: "narration", text: "یوگی با نگرانی صفحهٔ کناری را نگاه کرد." },
                { kind: "narration", text: "روی آن نوشته شده بود:" },
                { kind: "clue", text: "SLP", delayAfter: 2000 },
                { kind: "narration", text: "و زیر نوشته، یک نقاشی ترسناک دیده می شد." },
                { kind: "yogi", text: "SLP؟" },
                { kind: "yogi", text: "این یعنی چی؟" },
                { kind: "narration", text: "یوگی چند لحظه به نوشته و نقاشی خیره شد.", delayAfter: 1600 },
                { kind: "yogi", text: "نمی دونم اینا چی ان..." },
                { kind: "yogi", text: "ولی شاید به پیدا کردن نیلا کمک کنن." },
                { kind: "narration", text: "یوگی دفتر، هر دو مداد و پاک کن را داخل کیفش گذاشت." },
                { kind: "narration", text: "بعد به سمت دروازهٔ سبزرنگ انتهای غار رفت." },
                { kind: "yogi", text: "نیلا..." },
                { kind: "yogi", text: "من هنوز دنبالتم." },
                { kind: "yogi", text: "باید ادامه بدم." },
                { kind: "narration", text: "و یوگی وارد دروازه شد...", delayAfter: 1600 }
              ]
            }
          ]
        });

        const safeDecode = (value) => {
          try {
            return decodeURIComponent(value);
          } catch {
            return value;
          }
        };

        const readChallengeNumber = () => {
          const url = new URL(window.location.href);
          const namedQuery = url.searchParams.get("challenge")
            || url.searchParams.get("stage")
            || url.searchParams.get("puzzle");
          if (/^[1-9]\d*$/.test(namedQuery || "")) return Number(namedQuery);

          const bareQuery = safeDecode(url.search.replace(/^\?/, "")).trim();
          if (/^[1-9]\d*$/.test(bareQuery)) return Number(bareQuery);

          const hashValue = safeDecode(url.hash.replace(/^#\/?/, "")).trim();
          if (/^[1-9]\d*$/.test(hashValue)) return Number(hashValue);

          const pathMatch = safeDecode(url.pathname).match(/\/([1-9]\d*)\/?$/);
          if (pathMatch) return Number(pathMatch[1]);
          return 1;
        };

        const challengeNumber = readChallengeNumber();
        const selectedStory = stories[challengeNumber];
        const pages = selectedStory || [
          {
            nextLabel: "به زودی",
            final: true,
            autoplay: true,
            entries: [
              { kind: "chapter", text: `چالش ${challengeNumber}` },
              { kind: "narration", text: "این چالش هنوز آماده نشده است." },
              { kind: "narration", text: "بعداً دوباره به این مسیر سر بزن." }
            ]
          }
        ];

        document.title = selectedStory
          ? `یوگی | معمای ${challengeNumber}`
          : `یوگی | چالش ${challengeNumber}`;

        const loadingScreen = document.getElementById("loading-screen");
        const loadingImage = document.querySelector(".loading-image");
        const sceneViewport = document.getElementById("scene-viewport");
        let activeScene = document.getElementById("active-scene");
        const sceneBlueprint = activeScene.cloneNode(true);
        sceneBlueprint.removeAttribute("id");
        const nextButton = document.getElementById("next-button");
        const previousButton = document.getElementById("previous-button");
        const replayButton = document.getElementById("replay-button");
        const loadingPercentValue = document.getElementById("loading-percent-value");
        const messageAvatars = Object.freeze({ yogi: "yogi.webp" });
        const slideDuration = 940;
        const lastModifiedTime = Date.parse(document.lastModified);
        const assetVersion = Number.isFinite(lastModifiedTime)
          ? lastModifiedTime.toString(36)
          : "challenge-v1";
        const assetCacheName = `yogi-challenge-assets-${assetVersion}`;
        const assetCachePrefix = "yogi-challenge-assets-";
        const assetSources = new Map();
        const assetAvailability = new Map();
        const imageAssets = Object.freeze(Array.from(new Set([
          "loding.webp",
          ...pages.map((page) => page.image).filter(Boolean),
          ...pages.flatMap((page) => page.entries || []).map((entry) => entry.imageAfter).filter(Boolean),
          ...Object.values(messageAvatars)
        ])));
        let currentPage = 0;
        let playbackVersion = 0;
        let isSliding = false;
        const completedPages = new Set();

        const wait = (milliseconds) => new Promise((resolve) => {
          window.setTimeout(resolve, milliseconds);
        });

        const setLoadingProgress = (percent) => {
          loadingPercentValue.textContent = String(Math.max(0, Math.min(100, Math.round(percent))));
        };

        const freshAsset = (assetPath) => {
          const url = new URL(assetPath, document.baseURI);
          url.searchParams.set("v", assetVersion);
          return url.href;
        };

        const getAssetSource = (assetPath) => assetSources.get(assetPath) || freshAsset(assetPath);

        const preloadWithImage = (url) => new Promise((resolve) => {
          const image = new Image();
          let settled = false;
          const finish = (available) => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeoutId);
            resolve(available);
          };
          const timeoutId = window.setTimeout(() => finish(false), 4500);
          image.onload = () => finish(true);
          image.onerror = () => finish(false);
          image.src = url;
        });

        const openAssetCache = async () => {
          if (!("caches" in window)) return null;
          try {
            const cache = await window.caches.open(assetCacheName);
            const names = await window.caches.keys();
            await Promise.all(names
              .filter((name) => name.startsWith(assetCachePrefix) && name !== assetCacheName)
              .map((name) => window.caches.delete(name)));
            return cache;
          } catch {
            return null;
          }
        };

        const loadAsset = async (assetPath, cache) => {
          const url = freshAsset(assetPath);
          try {
            let response = cache ? await cache.match(url) : null;
            if (!response) {
              response = await fetch(url, { cache: "force-cache" });
              if (!response.ok) throw new Error(`Asset request failed: ${response.status}`);
              if (cache) await cache.put(url, response.clone());
            }
            const source = URL.createObjectURL(await response.blob());
            assetSources.set(assetPath, source);
            assetAvailability.set(assetPath, true);
            return source;
          } catch {
            const available = await preloadWithImage(url);
            assetAvailability.set(assetPath, available);
            if (available) assetSources.set(assetPath, url);
            return available ? url : null;
          }
        };

        const preloadStoryAssets = async () => {
          const startedAt = performance.now();
          const cache = await openAssetCache();
          let completed = 0;
          setLoadingProgress(0);

          await Promise.all(imageAssets.map(async (assetPath) => {
            const source = await loadAsset(assetPath, cache);
            if (assetPath === "loding.webp" && source) loadingImage.src = source;
            completed += 1;
            setLoadingProgress((completed / imageAssets.length) * 100);
          }));

          await wait(Math.max(0, 5000 - (performance.now() - startedAt)));
          setLoadingProgress(100);
        };

        const getSceneParts = (scene) => ({
          feed: scene.querySelector(".story-feed"),
          imageShell: scene.querySelector(".image-shell"),
          image: scene.querySelector(".story-image")
        });

        const getSceneFeed = (scene) => getSceneParts(scene).feed;

        const isAssetAvailable = (assetPath) => assetAvailability.get(assetPath) !== false
          && Boolean(assetSources.get(assetPath) || assetAvailability.get(assetPath) === true);

        const finalImageForPage = (page) => {
          let imagePath = page.image || null;
          for (const entry of page.entries || []) {
            if (entry.imageAfter) imagePath = entry.imageAfter;
          }
          return imagePath;
        };

        const torchClasses = Object.freeze(["torch-found", "torch-held", "torch-carried"]);

        const setTorchLight = (level = "dark") => {
          document.body.classList.remove(...torchClasses);
          if (level === "found") document.body.classList.add("torch-found");
          if (level === "held") document.body.classList.add("torch-held");
          if (level === "carried") document.body.classList.add("torch-carried");
        };

        const finalTorchLightForPage = (page) => {
          let level = "dark";
          for (const entry of page.entries || []) {
            if (entry.lightAfter) level = entry.lightAfter;
          }
          return level;
        };

        const setSceneImage = (scene, assetPath, direction = "next", animate = false) => {
          const { imageShell, image } = getSceneParts(scene);
          if (!imageShell || !image) return;

          // A quick replay/back action can interrupt an image transition; keep only the current layer.
          imageShell.querySelectorAll(".story-image").forEach((node, index) => {
            if (index > 0) node.remove();
          });

          if (!assetPath || !isAssetAvailable(assetPath)) {
            scene.classList.remove("has-image");
            image.removeAttribute("src");
            image.dataset.asset = "";
            return;
          }

          scene.classList.add("has-image");
          const source = getAssetSource(assetPath);
          if (!source) return;

          if (!animate || !image.getAttribute("src") || image.dataset.asset === assetPath) {
            image.src = source;
            image.dataset.asset = assetPath;
            image.alt = `تصویر ${assetPath.replace(/\.webp$/iu, "")}`;
            image.classList.remove("is-image-enter-left", "is-image-enter-right", "is-image-exit-left", "is-image-exit-right");
            image.classList.add("is-image-settled");
            return;
          }

          const incoming = image.cloneNode(false);
          incoming.src = source;
          incoming.dataset.asset = assetPath;
          incoming.alt = `تصویر ${assetPath.replace(/\.webp$/iu, "")}`;
          incoming.className = `story-image is-image-enter-${direction === "previous" ? "right" : "left"}`;
          imageShell.append(incoming);

          window.requestAnimationFrame(() => {
            const exitDirection = direction === "previous" ? "left" : "right";
            image.classList.remove("is-image-settled");
            image.classList.add(`is-image-exit-${exitDirection}`);
            incoming.classList.remove("is-image-enter-left", "is-image-enter-right");
            incoming.classList.add("is-image-settled");
          });

          window.setTimeout(() => {
            if (!incoming.isConnected) return;
            image.remove();
            incoming.classList.remove("is-image-settled");
            incoming.classList.add("is-image-settled");
          }, 940);
        };

        const syncControls = (page, pageIndex, isLocked = false, allowContinueDuringTyping = false) => {
          nextButton.textContent = page.nextLabel || "ادامه";
          nextButton.hidden = false;
          nextButton.disabled = isLocked || Boolean(page.final || (page.autoplay && !allowContinueDuringTyping));
          previousButton.hidden = pageIndex < 1;
          previousButton.disabled = isLocked;
          replayButton.hidden = true;
          replayButton.disabled = isLocked;
        };

        const prepareScene = (scene, page) => {
          const { feed } = getSceneParts(scene);
          feed.replaceChildren();
          feed.scrollTop = 0;
          feed.classList.remove("is-complete");
          setTorchLight("dark");
          setSceneImage(scene, page?.image || null, "next", false);
        };

        const scrollFeedToBottom = (feed, behavior = "smooth") => {
          feed.scrollTo({ top: feed.scrollHeight, behavior });
        };

        const typingDelay = (character) => {
          if (/\s/u.test(character)) return 10;
          if (/[.!؟!?…]/u.test(character)) return 310;
          if (/[،؛:]/u.test(character)) return 190;
          return 68;
        };

        const createEntryRow = (entry) => {
          const row = document.createElement("div");
          row.className = `story-entry ${entry.kind}`;
          const bubble = document.createElement("div");
          bubble.className = "message-bubble";

          const avatarSource = messageAvatars[entry.kind];
          if (avatarSource) {
            const avatar = document.createElement("img");
            avatar.className = "message-avatar";
            avatar.src = getAssetSource(avatarSource);
            avatar.alt = "";
            avatar.setAttribute("aria-hidden", "true");
            row.append(avatar);
          }

          row.append(bubble);
          return { row, bubble };
        };

        const appendEntryInstant = (entry, feed) => {
          const { row, bubble } = createEntryRow(entry);
          row.classList.add("is-instant");
          bubble.textContent = entry.text;
          feed.append(row);
        };

        const renderCompletedEntries = (page, feed) => {
          feed.replaceChildren();
          page.entries.forEach((entry) => appendEntryInstant(entry, feed));
          feed.classList.add("is-complete");
          feed.scrollTop = feed.scrollHeight;
        };

        const appendEntry = async (entry, version, feed, scene) => {
          const { row, bubble } = createEntryRow(entry);
          feed.append(row);
          window.requestAnimationFrame(() => scrollFeedToBottom(feed));

          for (const character of entry.text) {
            if (version !== playbackVersion) return false;
            bubble.textContent += character;
            feed.scrollTop = feed.scrollHeight;
            await wait(typingDelay(character));
          }

          if (version === playbackVersion && entry.imageAfter) {
            setSceneImage(scene, entry.imageAfter, "next", true);
          }

          if (version === playbackVersion && entry.lightAfter) {
            setTorchLight(entry.lightAfter);
          }

          return version === playbackVersion;
        };

        const finishPage = (page, pageIndex, feed) => {
          completedPages.add(pageIndex);
          nextButton.disabled = Boolean(page.final);
          previousButton.disabled = false;
          replayButton.hidden = false;
          replayButton.disabled = false;
          feed.classList.add("is-complete");
          feed.scrollTop = feed.scrollHeight;
        };

        const playEntries = async (page, pageIndex, version, feed, scene) => {
          for (const entry of page.entries) {
            const completed = await appendEntry(entry, version, feed, scene);
            if (!completed) return;
            await wait(entry.delayAfter ?? 1000);
          }

          if (version === playbackVersion) finishPage(page, pageIndex, feed);
        };

        const startSceneContent = (scene, pageIndex, version) => {
          const page = pages[pageIndex];
          const { feed } = getSceneParts(scene);

          if (completedPages.has(pageIndex)) {
            setSceneImage(scene, finalImageForPage(page), "next", false);
            setTorchLight(finalTorchLightForPage(page));
            renderCompletedEntries(page, feed);
            finishPage(page, pageIndex, feed);
            return;
          }

          void playEntries(page, pageIndex, version, feed, scene);
        };

        const startPage = (scene, pageIndex, version = ++playbackVersion) => {
          const page = pages[pageIndex];
          prepareScene(scene, page);
          syncControls(page, pageIndex);
          startSceneContent(scene, pageIndex, version);
        };

        const transitionTo = (targetIndex, direction) => {
          if (isSliding || targetIndex < 0 || targetIndex >= pages.length) return;

          isSliding = true;
          if (!completedPages.has(currentPage)) completedPages.add(currentPage);
          const version = ++playbackVersion;
          const outgoingScene = activeScene;
          const incomingScene = sceneBlueprint.cloneNode(true);
          const enteringClass = direction === "next" ? "enter-from-left" : "enter-from-right";
          const exitingClass = direction === "next" ? "exit-to-right" : "exit-to-left";

          currentPage = targetIndex;
          incomingScene.classList.add(enteringClass);
          prepareScene(incomingScene, pages[currentPage]);
          syncControls(pages[currentPage], currentPage, true);
          sceneViewport.append(incomingScene);

          void incomingScene.offsetWidth;
          window.requestAnimationFrame(() => {
            incomingScene.classList.remove(enteringClass);
            outgoingScene.classList.add(exitingClass);
          });

          window.setTimeout(() => {
            if (version !== playbackVersion || !incomingScene.isConnected) return;
            outgoingScene.remove();
            incomingScene.id = "active-scene";
            activeScene = incomingScene;
            isSliding = false;
            previousButton.disabled = false;
            startSceneContent(activeScene, currentPage, version);
          }, slideDuration);
        };

        nextButton.addEventListener("click", () => {
          transitionTo(currentPage + 1, "next");
        });

        previousButton.addEventListener("click", () => {
          transitionTo(currentPage - 1, "previous");
        });

        let swipeStart = null;
        sceneViewport.addEventListener("pointerdown", (event) => {
          if (isSliding || !completedPages.has(currentPage) || !event.target.closest(".media-pane")) return;
          swipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
          try { sceneViewport.setPointerCapture(event.pointerId); } catch { /* pointer capture is optional */ }
        });

        sceneViewport.addEventListener("pointerup", (event) => {
          if (!swipeStart || swipeStart.pointerId !== event.pointerId) return;
          const deltaX = event.clientX - swipeStart.x;
          const deltaY = event.clientY - swipeStart.y;
          swipeStart = null;
          if (Math.abs(deltaX) < 48 || Math.abs(deltaX) < Math.abs(deltaY) * 1.15) return;
          transitionTo(currentPage + (deltaX < 0 ? 1 : -1), deltaX < 0 ? "next" : "previous");
        });

        sceneViewport.addEventListener("pointercancel", () => { swipeStart = null; });

        window.addEventListener("keydown", (event) => {
          if (!completedPages.has(currentPage) || isSliding) return;
          if (event.key === "ArrowLeft") transitionTo(currentPage + 1, "next");
          if (event.key === "ArrowRight") transitionTo(currentPage - 1, "previous");
        });

        replayButton.addEventListener("click", () => {
          if (isSliding) return;
          const version = ++playbackVersion;
          completedPages.delete(currentPage);
          prepareScene(activeScene, pages[currentPage]);
          syncControls(pages[currentPage], currentPage, false, true);
          startSceneContent(activeScene, currentPage, version);
        });

        void preloadStoryAssets().finally(() => {
          loadingScreen.classList.add("is-complete");
          window.setTimeout(() => startPage(activeScene, currentPage), 620);
        });
      })();
    </script>
  </body>
</html>
